# Maßnahmenmodell 2607-07, Stand 2607-07_8
# Modelldatei für risk-pilot (https://github.com/ToHeinAC/risk-pilot), schema_version 1.
#
# Aufbau:
#   Schalter     constant 0/1 je Maßnahme (1 = aktiv). Im Hauptszenario „basis“ ist nichts aktiv.
#   Kosten       constant je Maßnahme und zutreffender Kostenart (Level 0). Alle Werte sind 0:
#                Platzhalter, bis Budgets erfasst sind (dann z. B. als uncertain mit P10/P50/P90).
#   Wirkungen    derived 0/1 je Richtung einer Synergie oder Dysergie (A auf B und B auf A),
#                aktiv, wenn beide Maßnahmen aktiv sind. Art und Höhe der Wirkung sind noch nicht modelliert.
#   Ausschlüsse  derived 0/1 je Paar, das sich gegenseitig ausschließt: 1, wenn beide aktiv sind.
#   Wegprüfung   derived 0/1 je Maßnahme ab Level 2: 1, wenn sie aktiv ist, aber keine der Maßnahmen,
#                von denen eine Verknüpfung zu ihr führt.
#   Outputs      Kosten je Kostenart und gesamt, Anzahl Synergie-/Dysergie-Wirkungen, Maßnahmen ohne Weg.
#   Szenarien    Baum entlang der Verknüpfungen: Level 1 → Level 2 → Wege (W01 bis W50).
#                Jeder Weg setzt nur seine letzte Maßnahme; den Rest erbt er vom Elternszenario.
#
# Offene Punkte stehen in 2607-07_8.md unter „General“.
