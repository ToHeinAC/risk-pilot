  fehlt_l3_8_l3_9: {type: "derived", expr: "l3_8_schadstoff_nachlaufend * (1 - l3_9_ext_expertise)", name: "L3-8 Schadstoffsanierung nachlaufend ohne L3-9 Einbindung ext. Expertise", description: "1, wenn L3-8 aktiv ist, die notwendige Maßnahme L3-9 aber nicht.", tags: ["Notwendigkeit"]}
  # ---------- Outputs
  kosten_genehmigung: {type: "derived", expr: "l2_2_freigabe_innovativ * k_l2_2_g + l2_3_freigabe_efn * k_l2_3_g + l3_4_vehikel * k_l3_4_g + l3_5_lueftung_umbau * k_l3_5_g", name: "Kosten Genehmigung (L0-1)", description: "Summe der Kostenart Genehmigung über alle aktiven Maßnahmen.", track: true}
  kosten_betrieb: {type: "derived", expr: "l2_1_freigabe_standard * k_l2_1_b + l2_2_freigabe_innovativ * k_l2_2_b + l3_1_stoerstellen * k_l3_1_b + l3_2_efn_10m2 * k_l3_2_b + l3_3_gammakamera * k_l3_3_b + l3_4_vehikel * k_l3_4_b + l3_5_lueftung_umbau * k_l3_5_b + l3_7_schadstoff_vorlaufend * k_l3_7_b + l3_8_schadstoff_nachlaufend * k_l3_8_b + l3_9_ext_expertise * k_l3_9_b", name: "Kosten Betrieb (L0-2)", description: "Summe der Kostenart Betrieb über alle aktiven Maßnahmen.", track: true}
