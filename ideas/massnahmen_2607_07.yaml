  dys_l4_3_auf_l3_4: {type: "derived", expr: "l4_3_vehikel * l3_4_schadstoff_vorlaufend", name: "Dysergie L4-3 Ferngesteuertes Vehikel → L3-4 Schadstoffsanierung vorlaufend", description: "1, wenn beide aktiv sind: Wirkung von L4-3 auf L3-4. Art und Höhe der Wirkung noch nicht modelliert.", tags: ["Dysergie", "von L4-3", "auf L3-4"]}
  # ---------- Ausschlüsse (1 = verletzt)
  aus_l1_1_l1_2: {type: "derived", expr: "l1_1_atg * l1_2_strlschg", name: "Ausschluss L1-1 AtG + L1-2 StrlSchG", description: "1, wenn beide aktiv sind, also der Ausschluss verletzt ist.", tags: ["Ausschluss"]}
  aus_l2_1_l2_2: {type: "derived", expr: "l2_1_freigabe_standard * l2_2_freigabe_innovativ", name: "Ausschluss L2-1 Freigabe standard + L2-2 Freigabe innovativ", description: "1, wenn beide aktiv sind, also der Ausschluss verletzt ist.", tags: ["Ausschluss"]}
  aus_l2_1_l2_3: {type: "derived", expr: "l2_1_freigabe_standard * l2_3_freigabe_efn", name: "Ausschluss L2-1 Freigabe standard + L2-3 Freigabe EFN", description: "1, wenn beide aktiv sind, also der Ausschluss verletzt ist.", tags: ["Ausschluss"]}
  aus_l2_2_l2_3: {type: "derived", expr: "l2_2_freigabe_innovativ * l2_3_freigabe_efn", name: "Ausschluss L2-2 Freigabe innovativ + L2-3 Freigabe EFN", description: "1, wenn beide aktiv sind, also der Ausschluss verletzt ist.", tags: ["Ausschluss"]}
  aus_l3_2_l3_3: {type: "derived", expr: "l3_2_lueftung_umbau * l3_3_lueftung_einfach", name: "Ausschluss L3-2 Umbau Lüftungsanlage + L3-3 Einfache Lüftung", description: "1, wenn beide aktiv sind, also der Ausschluss verletzt ist.", tags: ["Ausschluss"]}
  aus_l3_4_l3_5: {type: "derived", expr: "l3_4_schadstoff_vorlaufend * l3_5_schadstoff_nachlaufend", name: "Ausschluss L3-4 Schadstoffsanierung vorlaufend + L3-5 Schadstoffsanierung nachlaufend", description: "1, wenn beide aktiv sind, also der Ausschluss verletzt ist.", tags: ["Ausschluss"]}
  # ---------- Wegprüfung (1 = aktiv, aber ohne aktive Maßnahme, von der eine Verknüpfung zu ihr führt)
  ohne_weg_l2_1: {type: "derived", expr: "l2_1_freigabe_standard * (1 - min(1, l1_1_atg + l1_2_strlschg))", name: "L2-1 Freigabe standard ohne Weg", description: "1, wenn L2-1 aktiv ist, aber keine der verknüpften Maßnahmen L1-1, L1-2.", tags: ["Wegprüfung"]}
  ohne_weg_l2_2: {type: "derived", expr: "l2_2_freigabe_innovativ * (1 - min(1, l1_1_atg + l1_2_strlschg))", name: "L2-2 Freigabe innovativ ohne Weg", description: "1, wenn L2-2 aktiv ist, aber keine der verknüpften Maßnahmen L1-1, L1-2.", tags: ["Wegprüfung"]}
  ohne_weg_l2_3: {type: "derived", expr: "l2_3_freigabe_efn * (1 - min(1, l1_1_atg + l1_2_strlschg))", name: "L2-3 Freigabe EFN ohne Weg", description: "1, wenn L2-3 aktiv ist, aber keine der verknüpften Maßnahmen L1-1, L1-2.", tags: ["Wegprüfung"]}
  ohne_weg_l3_1: {type: "derived", expr: "l3_1_stoerstellen * (1 - min(1, l2_1_freigabe_standard + l2_2_freigabe_innovativ + l2_3_freigabe_efn))", name: "L3-1 Störstellensanierung (inkl. RBS) ohne Weg", description: "1, wenn L3-1 aktiv ist, aber keine der verknüpften Maßnahmen L2-1, L2-2, L2-3.", tags: ["Wegprüfung"]}
  ohne_weg_l3_2: {type: "derived", expr: "l3_2_lueftung_umbau * (1 - l2_1_freigabe_standard)", name: "L3-2 Umbau Lüftungsanlage ohne Weg", description: "1, wenn L3-2 aktiv ist, aber keine der verknüpften Maßnahmen L2-1.", tags: ["Wegprüfung"]}
  ohne_weg_l3_3: {type: "derived", expr: "l3_3_lueftung_einfach * (1 - min(1, l2_2_freigabe_innovativ + l2_3_freigabe_efn))", name: "L3-3 Einfache Lüftung ohne Weg", description: "1, wenn L3-3 aktiv ist, aber keine der verknüpften Maßnahmen L2-2, L2-3.", tags: ["Wegprüfung"]}
  ohne_weg_l3_4: {type: "derived", expr: "l3_4_schadstoff_vorlaufend * (1 - min(1, l2_1_freigabe_standard + l2_2_freigabe_innovativ))", name: "L3-4 Schadstoffsanierung vorlaufend ohne Weg", description: "1, wenn L3-4 aktiv ist, aber keine der verknüpften Maßnahmen L2-1, L2-2.", tags: ["Wegprüfung"]}
  ohne_weg_l3_5: {type: "derived", expr: "l3_5_schadstoff_nachlaufend * (1 - min(1, l2_1_freigabe_standard + l2_2_freigabe_innovativ))", name: "L3-5 Schadstoffsanierung nachlaufend ohne Weg", description: "1, wenn L3-5 aktiv ist, aber keine der verknüpften Maßnahmen L2-1, L2-2.", tags: ["Wegprüfung"]}
  ohne_weg_l4_1: {type: "derived", expr: "l4_1_efn_10m2 * (1 - min(1, l2_1_freigabe_standard + l3_1_stoerstellen))", name: "L4-1 EFN 10m² ohne Weg", description: "1, wenn L4-1 aktiv ist, aber keine der verknüpften Maßnahmen L2-1, L3-1.", tags: ["Wegprüfung"]}
  ohne_weg_l4_2: {type: "derived", expr: "l4_2_gammakamera * (1 - min(1, l2_2_freigabe_innovativ + l3_3_lueftung_einfach + l3_5_schadstoff_nachlaufend))", name: "L4-2 Qualifizierung neue Messtechnik (Gammakamera) ohne Weg", description: "1, wenn L4-2 aktiv ist, aber keine der verknüpften Maßnahmen L2-2, L3-3, L3-5.", tags: ["Wegprüfung"]}
  ohne_weg_l4_3: {type: "derived", expr: "l4_3_vehikel * (1 - min(1, l3_3_lueftung_einfach + l3_5_schadstoff_nachlaufend))", name: "L4-3 Ferngesteuertes Vehikel ohne Weg", description: "1, wenn L4-3 aktiv ist, aber keine der verknüpften Maßnahmen L3-3, L3-5.", tags: ["Wegprüfung"]}
  ohne_weg_l4_4: {type: "derived", expr: "l4_4_ext_expertise * (1 - min(1, l2_2_freigabe_innovativ + l2_3_freigabe_efn))", name: "L4-4 Einbindung ext. FG-Expertise ohne Weg", description: "1, wenn L4-4 aktiv ist, aber keine der verknüpften Maßnahmen L2-2, L2-3.", tags: ["Wegprüfung"]}
  # ---------- Kosten je Kostenart
  kosten_genehmigung: {type: "derived", expr: "sum(l2_2_freigabe_innovativ * k_l2_2_g, l2_3_freigabe_efn * k_l2_3_g, l3_2_lueftung_umbau * k_l3_2_g, l4_3_vehikel * k_l4_3_g)", name: "Kosten Genehmigung (L0-1)", description: "Summe der Kostenart Genehmigung über alle aktiven Maßnahmen.", track: true}
  kosten_betrieb: {type: "derived", expr: "sum(l2_1_freigabe_standard * k_l2_1_b, l2_2_freigabe_innovativ * k_l2_2_b, l3_1_stoerstellen * k_l3_1_b, l3_2_lueftung_umbau * k_l3_2_b, l3_4_schadstoff_vorlaufend * k_l3_4_b, l3_5_schadstoff_nachlaufend * k_l3_5_b, l4_1_efn_10m2 * k_l4_1_b, l4_2_gammakamera * k_l4_2_b, l4_3_vehikel * k_l4_3_b, l4_4_ext_expertise * k_l4_4_b)", name: "Kosten Betrieb (L0-2)", description: "Summe der Kostenart Betrieb über alle aktiven Maßnahmen.", track: true}
  kosten_investment: {type: "derived", expr: "sum(l2_2_freigabe_innovativ * k_l2_2_i, l3_2_lueftung_umbau * k_l3_2_i, l3_3_lueftung_einfach * k_l3_3_i, l4_3_vehikel * k_l4_3_i)", name: "Kosten Investment (L0-3)", description: "Summe der Kostenart Investment über alle aktiven Maßnahmen.", track: true}
  # ---------- Outputs
  kosten_gesamt: {type: "output", expr: "kosten_genehmigung + kosten_betrieb + kosten_investment", name: "Kosten gesamt", description: "Summe aller Kostenarten der aktiven Maßnahmen (ohne Wirkung von Synergien und Dysergien).", better: "lower"}
