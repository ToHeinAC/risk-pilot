  kosten_gesamt: {type: "output", expr: "kosten_genehmigung + kosten_betrieb + kosten_investment", name: "Kosten gesamt", description: "Summe aller Kostenarten der aktiven Maßnahmen (ohne Wirkung von Synergien und Dysergien).", better: "lower"}
  anzahl_synergien: {type: "output", expr: "syn_l1_1_auf_l2_2 + syn_l2_2_auf_l1_1 + syn_l1_1_auf_l2_3 + syn_l2_3_auf_l1_1 + syn_l1_1_auf_l3_2 + syn_l3_2_auf_l1_1 + syn_l1_1_auf_l3_3 + syn_l3_3_auf_l1_1 + syn_l1_1_auf_l3_5 + syn_l3_5_auf_l1_1 + syn_l1_2_auf_l3_6 + syn_l3_6_auf_l1_2 + syn_l2_1_auf_l3_2 + syn_l3_2_auf_l2_1 + syn_l2_1_auf_l3_7 + syn_l3_7_auf_l2_1 + syn_l2_2_auf_l3_8 + syn_l3_8_auf_l2_2 + syn_l2_3_auf_l3_8 + syn_l3_8_auf_l2_3 + syn_l3_1_auf_l3_7 + syn_l3_7_auf_l3_1 + syn_l3_6_auf_l3_7 + syn_l3_7_auf_l3_6 + syn_l3_2_auf_l3_8 + syn_l3_8_auf_l3_2 + syn_l3_5_auf_l3_8 + syn_l3_8_auf_l3_5 + syn_l3_2_auf_l3_3 + syn_l3_3_auf_l3_2", name: "Anzahl Synergie-Wirkungen", description: "Zahl der aktiven Synergie-Wirkungen, ungewichtet; jede Richtung zählt einzeln, ein aktives Paar also 2.", better: "higher"}
  anzahl_dysergien: {type: "output", expr: "dys_l1_1_auf_l3_6 + dys_l3_6_auf_l1_1 + dys_l1_2_auf_l2_2 + dys_l2_2_auf_l1_2 + dys_l1_2_auf_l2_3 + dys_l2_3_auf_l1_2 + dys_l1_2_auf_l3_2 + dys_l3_2_auf_l1_2 + dys_l1_2_auf_l3_3 + dys_l3_3_auf_l1_2 + dys_l1_2_auf_l3_4 + dys_l3_4_auf_l1_2 + dys_l1_2_auf_l3_5 + dys_l3_5_auf_l1_2 + dys_l2_1_auf_l3_6 + dys_l3_6_auf_l2_1", name: "Anzahl Dysergie-Wirkungen", description: "Zahl der aktiven Dysergie-Wirkungen, ungewichtet; jede Richtung zählt einzeln, ein aktives Paar also 2.", better: "lower"}
  verletzte_ausschluesse: {type: "output", expr: "aus_l3_7_l3_8 + aus_l3_5_l3_7 + aus_l2_1_l2_2 + aus_l2_1_l2_3 + aus_l2_1_l3_3 + aus_l2_1_l3_4", name: "Verletzte Ausschlüsse", description: "Zahl der aktiven Paare, die sich laut Quelle ausschließen. Ziel: 0.", target: {le: 0}}
  fehlende_notwendigkeiten: {type: "output", expr: "fehlt_l3_7_l3_9 + fehlt_l3_8_l3_9", name: "Fehlende Notwendigkeiten", description: "Zahl der aktiven Maßnahmen, deren notwendige Maßnahme fehlt. Ziel: 0.", target: {le: 0}}
