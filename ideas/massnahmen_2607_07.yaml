  anzahl_dysergien: {type: "output", expr: "sum(dys_l1_2_auf_l2_2, dys_l2_2_auf_l1_2, dys_l1_2_auf_l2_3, dys_l2_3_auf_l1_2, dys_l2_1_auf_l3_3, dys_l3_3_auf_l2_1, dys_l2_1_auf_l3_5, dys_l3_5_auf_l2_1, dys_l2_2_auf_l3_2, dys_l3_2_auf_l2_2, dys_l2_2_auf_l3_4, dys_l3_4_auf_l2_2, dys_l2_3_auf_l3_2, dys_l3_2_auf_l2_3, dys_l2_3_auf_l3_4, dys_l3_4_auf_l2_3, dys_l2_1_auf_l4_2, dys_l4_2_auf_l2_1, dys_l2_1_auf_l4_3, dys_l4_3_auf_l2_1, dys_l2_3_auf_l4_2, dys_l4_2_auf_l2_3, dys_l2_3_auf_l4_1, dys_l4_1_auf_l2_3, dys_l2_3_auf_l4_3, dys_l4_3_auf_l2_3, dys_l3_2_auf_l4_2, dys_l4_2_auf_l3_2, dys_l3_2_auf_l4_3, dys_l4_3_auf_l3_2, dys_l3_4_auf_l4_3, dys_l4_3_auf_l3_4)", name: "Anzahl Dysergie-Wirkungen", description: "Zahl der aktiven Dysergie-Wirkungen, ungewichtet; jede Richtung zählt einzeln, ein aktives Paar also 2.", better: "lower"}
  verletzte_ausschluesse: {type: "output", expr: "sum(aus_l1_1_l1_2, aus_l2_1_l2_2, aus_l2_1_l2_3, aus_l2_2_l2_3, aus_l3_2_l3_3, aus_l3_4_l3_5)", name: "Verletzte Ausschlüsse", description: "Zahl der aktiven Paare, die sich gegenseitig ausschließen. Ziel: 0.", target: {le: 0}}
  massnahmen_ohne_weg: {type: "output", expr: "sum(ohne_weg_l2_1, ohne_weg_l2_2, ohne_weg_l2_3, ohne_weg_l3_1, ohne_weg_l3_2, ohne_weg_l3_3, ohne_weg_l3_4, ohne_weg_l3_5, ohne_weg_l4_1, ohne_weg_l4_2, ohne_weg_l4_3, ohne_weg_l4_4)", name: "Maßnahmen ohne Weg", description: "Zahl der aktiven Maßnahmen ab Level 2 ohne aktive Maßnahme, von der eine Verknüpfung zu ihr führt. Ziel: 0.", target: {le: 0}}
