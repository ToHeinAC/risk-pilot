  aus_l2_1_l3_3: {type: "derived", expr: "l2_1_freigabe_standard * l3_3_gammakamera", name: "Ausschluss L2-1 Freigabe standard + L3-3 Qualifizierung neue Messtechnik (Gammakamera)", description: "1, wenn beide aktiv sind, also der Ausschluss verletzt ist.", tags: ["Ausschluss"]}
