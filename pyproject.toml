[project]
name = "risk-pilot"
version = "0.1.0"
description = "Evidence-based risk-management tool"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "nicegui>=3.18.0",
    "numpy>=2.4.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
    "scipy-stubs>=1.17.1.5",
    "types-networkx>=3.6.1.20261024",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --- Quality gate numbers live here (README: "Where each rule is enforced") ---

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PT", "RUF", "PLR0915"]

# German UI texts use the en dash, the minus sign, the narrow no-break space (thousands) and
# Greek letters of statistical notation on purpose.
allowed-confusables = ["–", "−", "\u202f", "α", "σ", "μ", "ρ", "λ", "×"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.pyright]
include = ["src", "tests", ".claude/hooks"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
session_timeout = 60

[tool.coverage.run]
branch = true
source = ["src", ".claude/hooks"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
