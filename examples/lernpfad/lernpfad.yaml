- id: a01_serie
  title: 'Serie: Abschnitte addieren sich'
  model: a01_serie.yaml
  text: a01_serie.md
  output: gesamt
  rule: Mittelwerte und Varianzen addieren sich; die Streuung wächst langsamer als die Summe, die relative
    Streuung sinkt mit jedem Abschnitt.
  question:
    text: Was passiert mit der Streuung der Gesamtfahrzeit, wenn ein weiterer Abschnitt hinzukommt?
    options:
    - Sie steigt
    - Sie bleibt gleich
    - Sie sinkt
    answer: 0
    metric: sd
  knob:
    node: abschnitte
    field: value
    label: Anzahl Abschnitte
    values:
    - 1
    - 2
    - 3
  reference: sum_normal
  sources:
  - malcolm1959
